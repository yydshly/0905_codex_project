<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" role="img" aria-labelledby="title desc"><title id="title">dzhng/skills 全部 22 项能力与使用顺序</title><desc id="desc">六步主流程，review 内部三步顺序，行为和视觉验证，可选执行工具与领域技能，以及 write-skills 与 eval-skills 改进循环。主流程按任务裁剪，按需技能不要求依次调用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#bb4b2c"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#527663"/></marker></defs><rect width="1600" height="1530" fill="#f5f3ed"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="60" y="52" font-size="15" fill="#bb4b2c" font-weight="600">007 / ENGINEERING WORKFLOW ATLAS</text>
<text x="60" y="107" font-size="39" fill="#243b2e" font-weight="650">从需求到效果：22 个 Skill 如何协作</text>
<text x="60" y="146" font-size="18" fill="#697263" font-weight="400">源码流程的中文整理 · 研究版本 3631529 · 实线表示阶段顺序，虚线表示按需调用或反馈；不代表全部强制执行。</text>
<text x="60" y="194" font-size="19" fill="#bb4b2c" font-weight="600">A / 大功能主流程</text>
<rect x="60" y="220" width="230" height="102" rx="8" fill="#fffdf7" stroke="#cdd3c5"/>
<text x="75" y="247" font-size="18" fill="#263e32" font-weight="600">explore-unknowns</text>

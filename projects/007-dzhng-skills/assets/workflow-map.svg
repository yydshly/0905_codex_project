<text x="825" y="247" font-size="18" fill="#263e32" font-weight="600">review</text>
<text x="825" y="275" font-size="17" fill="#354838" font-weight="400">04 审查本轮结果</text>
<text x="825" y="301" font-size="14" fill="#6b7566" font-weight="400">结构 → 差异 → 文档</text>

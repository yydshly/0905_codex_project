<text x="1075" y="247" font-size="18" fill="#263e32" font-weight="600">audit-choices</text>
<text x="1075" y="275" font-size="17" fill="#354838" font-weight="400">05 公开自主决定</text>
<text x="1075" y="301" font-size="14" fill="#6b7566" font-weight="400">缺口、影响、判断与信心</text>

<text x="327" y="508" font-size="18" fill="#263e32" font-weight="600">code-review</text>
<text x="327" y="536" font-size="17" fill="#354838" font-weight="400">审查稳定后的差异</text>
<text x="327" y="562" font-size="14" fill="#6b7566" font-weight="400">命名、引用与复杂度</text>
<path d="M524 532 H539" fill="none" stroke="#bb4b2c" stroke-width="2"  marker-end="url(#arrow)"/>

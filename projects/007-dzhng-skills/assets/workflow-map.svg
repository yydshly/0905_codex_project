<text x="556" y="508" font-size="18" fill="#263e32" font-weight="600">write-docs</text>
<text x="556" y="536" font-size="17" fill="#354838" font-weight="400">更新文档与入口</text>
<text x="556" y="562" font-size="14" fill="#6b7566" font-weight="400">理由、约束、事实来源</text>
<text x="84" y="630" font-size="18" fill="#354838" font-weight="400">后续审查若改变结构，就返回前序步骤重新检查。</text>
<text x="84" y="664" font-size="18" fill="#354838" font-weight="400">每块任务审查后，整体完成时还要再审查完整改动。</text>
<text x="84" y="703" font-size="16" fill="#697263" font-weight="400">决策审计发现问题，由实现流程修正；审计本身不改代码。</text>

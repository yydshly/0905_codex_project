<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">HumanLayer Skills：五个独立 Skill 与简单场景</title><desc id="desc">每行展示一个 Skill 的能力、处理问题和示例请求。五项可单独使用，复杂工作流主要属于第三和第四项。</desc><rect width="1440" height="980" fill="#f4f6f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142b2b"><text x="56" y="56" font-size="16" letter-spacing="3" fill="#507365">006 / HUMANLAYER SKILLS · 中文研究引导图</text><text x="56" y="120" font-size="44" font-weight="700">就是五个 Skill，各自解决一类问题。</text><text x="56" y="163" font-size="21" fill="#657471">挑选需要的一项 → AI 助手读取工作说明 → 使用现有工具执行 → 交付结果</text><text x="85" y="215" font-size="15" fill="#507365">SKILL / 能力</text><text x="540" y="215" font-size="15" fill="#507365">你遇到的问题</text><text x="980" y="215" font-size="15" fill="#507365">一句话使用示例</text><rect x="56" y="235" width="1328" height="116" rx="12" fill="#ffffff" stroke="#dbe2d8"/><text x="77" y="266" font-size="14" fill="#658257">01</text><text x="115" y="269" font-size="20" font-weight="700">整理项目规则</text><text x="115" y="305" font-family="Consolas,monospace" font-size="17" fill="#657471">improve-claude-md</text><text x="540" y="277" font-size="19">规则太多，AI 经常漏用或误用</text><text x="540" y="315" font-size="16" fill="#657471">产物：重新组织的 CLAUDE.md</text><text x="980" y="295" font-size="17">“把测试和 API 开发规则整理清楚。”</text><rect x="56" y="367" width="1328" height="116" rx="12" fill="#ffffff" stroke="#dbe2d8"/><text x="77" y="398" font-size="14" fill="#658257">02</text><text x="115" y="401" font-size="20" font-weight="700">收紧 React 参数类型</text><text x="115" y="437" font-family="Consolas,monospace" font-size="17" fill="#657471">narrow-react-prop-types</text><text x="540" y="409" font-size="19">为了测试方便，业务参数变得过于宽松</text><text x="540" y="447" font-size="16" fill="#657471">产物：类型、组件与测试的修改</text><text x="980" y="427" font-size="17">“检查重命名回调是否真的需要可选。”</text><rect x="56" y="499" width="1328" height="116" rx="12" fill="#ffffff" stroke="#dbe2d8"/><text x="77" y="530" font-size="14" fill="#658257">03</text><text x="115" y="533" font-size="20" font-weight="700">搭建重复任务流程</text><text x="115" y="569" font-family="Consolas,monospace" font-size="17" fill="#657471">build-iterated-agentic-loop</text><text x="540" y="541" font-size="19">旧 API 要分批迁移，每次都要重新交代</text><text x="540" y="579" font-size="16" fill="#657471">产物：任务 Skill 与工作流配置</text><text x="980" y="559" font-size="17">“每次迁移少量旧接口，检查后提 PR。”</text><rect x="56" y="631" width="1328" height="116" rx="12" fill="#ffffff" stroke="#dbe2d8"/><text x="77" y="662" font-size="14" fill="#658257">04</text><text x="115" y="665" font-size="20" font-weight="700">设计持续维护方案</text><text x="115" y="701" font-family="Consolas,monospace" font-size="17" fill="#657471">design-control-loop</text><text x="540" y="673" font-size="19">想改善代码质量，还没确定先查什么</text><text x="540" y="711" font-size="16" fill="#657471">产物：检测、执行与验收方案</text><text x="980" y="691" font-size="17">“确定检测哪些问题、每轮改多少。”</text><rect x="56" y="763" width="1328" height="116" rx="12" fill="#e8f1d0" stroke="#dbe2d8"/><text x="77" y="794" font-size="14" fill="#658257">05</text><text x="115" y="797" font-size="20" font-weight="700">用图解释当前问题</text><text x="115" y="833" font-family="Consolas,monospace" font-size="17" fill="#657471">show-me</text><text x="540" y="805" font-size="19">文字太长，看不清代码调用关系</text><text x="540" y="843" font-size="16" fill="#657471">产物：调用树、图解或 HTML 说明</text><text x="980" y="823" font-size="17">“画出点击保存后经过哪些模块。”</text><text x="56" y="925" font-size="17" fill="#507365">五项可独立使用，无需串联运行。第 03 / 04 项涉及自动化配置；场景均为说明示例，未执行上游 Skill。</text><text x="56" y="955" font-size="14" fill="#657471">依据 humanlayer/skills @ 3c26291 · 2026-09-05 · 本仓库原创示意图，非上游产品截图</text></g></svg>
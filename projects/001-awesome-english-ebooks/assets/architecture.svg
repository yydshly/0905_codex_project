<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1290" viewBox="0 0 1500 1290" role="img" aria-labelledby="title desc"><title id="title">英语外刊：来源、上游交付与下游处理完整架构</title><desc id="desc">绿色为已核实结构，橙色虚线为上游未公开的生产过程，蓝色为建议实现的获取、解析、清洗、结构化和应用流程。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#879087" stroke-width="1.5"/></marker></defs><rect width="1500" height="1290" fill="#faf9f5"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="30" font-weight="700" fill="#173c30">从内容来源，到可用知识</text><text x="45" y="96" font-size="18" fill="#606a62">awesome-english-ebooks · 架构研究示意 · 2026-09-05 · commit 56973cd</text><rect x="45" y="126" width="16" height="16" rx="4" fill="#edf5ee" stroke="#226147"/><text x="70" y="141" font-size="16" fill="#273d33" font-weight="400">已核实</text><rect x="320" y="126" width="16" height="16" rx="4" fill="#fff5e8" stroke="#ac641e"/><text x="345" y="141" font-size="16" fill="#273d33" font-weight="400">未公开 / 待核验</text><rect x="595" y="126" width="16" height="16" rx="4" fill="#eef2fc" stroke="#455c91"/><text x="620" y="141" font-size="16" fill="#273d33" font-weight="400">下游建议实现</text><text x="235" y="176" font-size="16" fill="#69746c" font-weight="400">范围：4 个当前目录；历史 README 提到卫报，Nature 仅有待核实线索。</text><text x="45" y="225" font-size="16" fill="#7c867e" font-weight="700">01 / ORIGINS</text><text x="45" y="259" font-size="23" fill="#173c30" font-weight="700">当前内容来源</text><text x="45" y="287" font-size="15" fill="#69746c" font-weight="400">身份已确认；渠道未知</text><rect x="235" y="195" width="275" height="105" rx="12" fill="#edf5ee" stroke="#226147" stroke-width="1.5" /><text x="255" y="227" font-size="21" fill="#226147" font-weight="700">经济学人</text><text x="255" y="256" font-size="17" fill="#273d33" font-weight="400">economist.com</text><text x="255" y="281" font-size="17" fill="#273d33" font-weight="400">经济 · 商业 · 国际事务</text><rect x="530" y="195" width="275" height="105" rx="12" fill="#edf5ee" stroke="#226147" stroke-width="1.5" /><text x="550" y="227" font-size="21" fill="#226147" font-weight="700">纽约客</text><text x="550" y="256" font-size="17" fill="#273d33" font-weight="400">newyorker.com</text><text x="550" y="281" font-size="17" fill="#273d33" font-weight="400">文化 · 报道 · 文学</text><rect x="825" y="195" width="275" height="105" rx="12" fill="#edf5ee" stroke="#226147" stroke-width="1.5" /><text x="845" y="227" font-size="21" fill="#226147" font-weight="700">大西洋月刊</text><text x="845" y="256" font-size="17" fill="#273d33" font-weight="400">theatlantic.com</text><text x="845" y="281" font-size="17" fill="#273d33" font-weight="400">社会 · 观点 · 长篇报道</text><rect x="1120" y="195" width="335" height="105" rx="12" fill="#edf5ee" stroke="#226147" stroke-width="1.5" /><text x="1140" y="227" font-size="21" fill="#226147" font-weight="700">连线</text><text x="1140" y="256" font-size="17" fill="#273d33" font-weight="400">wired.com</text><text x="1140" y="281" font-size="17" fill="#273d33" font-weight="400">科技 · 科学 · 数字文化</text><path d="M815 300 V350" stroke="#879087" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="45" y="385" font-size="16" fill="#7c867e" font-weight="700">02 / PRODUCTION</text><text x="45" y="419" font-size="23" fill="#173c30" font-weight="700">上游生产</text><text x="45" y="447" font-size="15" fill="#69746c" font-weight="400">保留未知边界</text><rect x="235" y="355" width="1220" height="110" rx="12" fill="#fff5e8" stroke="#ac641e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="255" y="387" font-size="21" fill="#ac641e" font-weight="700">获取 → 整理 → 打包：完整流程未公开</text><text x="255" y="416" font-size="17" fill="#273d33" font-weight="400">账号、接口、recipe 内容、调度方式与格式转换顺序均未确认。</text><text x="255" y="441" font-size="17" fill="#273d33" font-weight="400">样本证据：Atlantic / WIRED 存在 Calibre 元数据；不据此推断完整采集实现。</text><path d="M815 465 V510" stroke="#879087" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="45" y="545" font-size="16" fill="#7c867e" font-weight="700">03 / REPOSITORY</text><text x="45" y="579" font-size="23" fill="#173c30" font-weight="700">公开资源层</text><text x="45" y="607" font-size="15" fill="#69746c" font-weight="400">文件与链接可核验</text><rect x="235" y="515" width="395" height="120" rx="12" fill="#edf5ee" stroke="#226147" stroke-width="1.5" /><text x="255" y="547" font-size="21" fill="#226147" font-weight="700">按刊物 / 期次归档</text><text x="255" y="576" font-size="17" fill="#273d33" font-weight="400">EPUB 211 · MOBI 177 · PDF 180</text><text x="255" y="601" font-size="17" fill="#273d33" font-weight="400">这是文件数量，不是独立期次数量</text><rect x="650" y="515" width="395" height="120" rx="12" fill="#edf5ee" stroke="#226147" stroke-width="1.5" /><text x="670" y="547" font-size="21" fill="#226147" font-weight="700">README + GitHub Raw</text><text x="670" y="576" font-size="17" fill="#273d33" font-weight="400">分类导航 · 版本记录 · 文件交付</text><text x="670" y="601" font-size="17" fill="#273d33" font-weight="400">现有用途：下载 → 外部阅读器</text><rect x="1065" y="515" width="390" height="120" rx="12" fill="#edf5ee" stroke="#226147" stroke-width="1.5" /><text x="1085" y="547" font-size="21" fill="#226147" font-weight="700">历史音频索引</text><text x="1085" y="576" font-size="17" fill="#273d33" font-weight="400">15 个 JSON + Wiki 外链</text><text x="1085" y="601" font-size="17" fill="#273d33" font-weight="400">article / url，无句子时间戳</text><path d="M815 635 V685" stroke="#879087" stroke-width="2"  fill="none" marker-end="url(#arrow)"/><text x="45" y="720" font-size="16" fill="#7c867e" font-weight="700">04 / ACQUISITION</text><text x="45" y="754" font-size="23" fill="#173c30" font-weight="700">获取与留存</text><text x="45" y="782" font-size="15" fill="#69746c" font-weight="400">下游处理建议</text><rect x="235" y="690" width="395" height="100" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="255" y="722" font-size="21" fill="#455c91" font-weight="700">来源清单</text><text x="255" y="751" font-size="17" fill="#273d33" font-weight="400">commit · 路径 · blob SHA · 使用范围</text><rect x="650" y="690" width="395" height="100" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="670" y="722" font-size="21" fill="#455c91" font-weight="700">按需获取 / 校验</text><text x="670" y="751" font-size="17" fill="#273d33" font-weight="400">格式选择 · 临时文件 · SHA-256</text><rect x="1065" y="690" width="390" height="100" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="1085" y="722" font-size="21" fill="#455c91" font-weight="700">原件与状态留存</text><text x="1085" y="751" font-size="17" fill="#273d33" font-weight="400">获取时间 · 有限重试 · 失败记录</text><path d="M815 790 V840" stroke="#879087" stroke-width="2"  fill="none" marker-end="url(#arrow)"/><text x="45" y="880" font-size="16" fill="#7c867e" font-weight="700">05 / PROCESSING</text><text x="45" y="914" font-size="23" fill="#173c30" font-weight="700">处理与结构化</text><text x="45" y="942" font-size="15" fill="#69746c" font-weight="400">保留来源和定位</text><rect x="235" y="845" width="290" height="120" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="255" y="877" font-size="21" fill="#455c91" font-weight="700">格式解析</text><text x="255" y="906" font-size="17" fill="#273d33" font-weight="400">container → OPF → spine</text><text x="255" y="931" font-size="17" fill="#273d33" font-weight="400">PDF / MOBI 单独适配</text><rect x="545" y="845" width="290" height="120" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="565" y="877" font-size="21" fill="#455c91" font-weight="700">清洗与文章拆分</text><text x="565" y="906" font-size="17" fill="#273d33" font-weight="400">正文 / 导航 / 推广分离</text><text x="565" y="931" font-size="17" fill="#273d33" font-weight="400">作者与原文链接另行核验</text><rect x="855" y="845" width="290" height="120" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="875" y="877" font-size="21" fill="#455c91" font-weight="700">规范化与去重</text><text x="875" y="906" font-size="17" fill="#273d33" font-weight="400">刊物 → 期次 → 文章 → 段落</text><text x="875" y="931" font-size="17" fill="#273d33" font-weight="400">稳定 ID · 修订保留</text><rect x="1165" y="845" width="290" height="120" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="1185" y="877" font-size="21" fill="#455c91" font-weight="700">音频与索引</text><text x="1185" y="906" font-size="17" fill="#273d33" font-weight="400">标题候选匹配 · 置信度</text><text x="1185" y="931" font-size="17" fill="#273d33" font-weight="400">全文 / 可选向量索引</text><path d="M815 965 V1015" stroke="#879087" stroke-width="2"  fill="none" marker-end="url(#arrow)"/><text x="45" y="1055" font-size="16" fill="#7c867e" font-weight="700">06 / APPLICATIONS</text><text x="45" y="1089" font-size="23" fill="#173c30" font-weight="700">阅读与学习</text><text x="45" y="1117" font-size="15" fill="#69746c" font-weight="400">扩展能力，尚未实现</text><rect x="235" y="1020" width="395" height="105" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="255" y="1052" font-size="21" fill="#455c91" font-weight="700">来源可追溯的阅读</text><text x="255" y="1081" font-size="17" fill="#273d33" font-weight="400">文章目录 · 原文定位 · 阅读记录</text><rect x="650" y="1020" width="395" height="105" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="670" y="1052" font-size="21" fill="#455c91" font-weight="700">精读与学习</text><text x="670" y="1081" font-size="17" fill="#273d33" font-weight="400">选句解释 · 生词 · 笔记 · 复习</text><rect x="1065" y="1020" width="390" height="105" rx="12" fill="#eef2fc" stroke="#455c91" stroke-width="1.5" /><text x="1085" y="1052" font-size="21" fill="#455c91" font-weight="700">专题检索与问答</text><text x="1085" y="1081" font-size="17" fill="#273d33" font-weight="400">时间筛选 · 跨期比较 · 引用回跳</text><rect x="235" y="1165" width="1220" height="65" rx="12" fill="#e7ebe4"/><text x="255" y="1204" font-size="19" fill="#273d33" font-weight="400">贯穿下游：来源谱系 · 处理版本 · 质量抽查 · 错误隔离 / 重试 · 原文与派生内容分离</text><text x="45" y="1265" font-size="16" fill="#647066" font-weight="400">本图描述已核实的上游结构与建议的下游系统，不表示全部流程已经实现。</text></g></svg>
<text x="60" y="242.0" font-size="25" font-weight="700" fill="#81958A">01</text>
<text x="113" y="242.6" font-size="28" font-weight="700" fill="#20372F">转换与分块</text>
<text x="580" y="240.5" font-size="21" font-weight="400" fill="#627269">文件结构与长度驱动；不是全书语义理解</text>
<rect x="60" y="270" width="360" height="155" rx="15" fill="#EEF3FA" stroke="#416B9C" stroke-width="2"/>
<text x="82" y="313.9" font-size="26" font-weight="700" fill="#416B9C">输入与格式转换</text>
<text x="82" y="353.4" font-size="22" font-weight="400" fill="#20372F">PDF / DOCX / EPUB</text>
<text x="82" y="386.4" font-size="22" font-weight="400" fill="#20372F">Calibre → HTMLZ → HTML</text>
<rect x="490" y="270" width="420" height="155" rx="15" fill="#EEF3FA" stroke="#416B9C" stroke-width="2"/>
<text x="512" y="313.9" font-size="26" font-weight="700" fill="#416B9C">Markdown → 源文块</text>
<text x="512" y="353.4" font-size="22" font-weight="400" fill="#20372F">Pandoc 转换；目标约 6,000 字符</text>
<text x="512" y="386.4" font-size="22" font-weight="400" fill="#20372F">识别标题、段落、表格等结构</text>
<rect x="980" y="270" width="400" height="155" rx="15" fill="#FFF3DF" stroke="#956222" stroke-width="2"/>
<text x="1002" y="313.9" font-size="26" font-weight="700" fill="#956222">记录源文件与块清单</text>
<text x="1002" y="353.4" font-size="22" font-weight="400" fill="#20372F">source_fingerprint.json</text>
<text x="1002" y="386.4" font-size="22" font-weight="400" fill="#20372F">manifest.json：顺序与源文哈希</text>
<polyline points="420,347 482,347" fill="none" stroke="#81958A" stroke-width="3"/>

<text x="393" y="169.4" font-size="22" font-weight="400" fill="#287150">AI 语义任务</text>
<rect x="640" y="153" width="20" height="20" rx="15" fill="#FFF3DF" stroke="#956222" stroke-width="2"/>
<text x="673" y="169.4" font-size="22" font-weight="400" fill="#956222">共享记录</text>

<polygon points="1387.0,605.0 1398.5,599.0 1398.5,611.0" fill="#956222"/>
<text x="60" y="1211.2" font-size="23" font-weight="400" fill="#956222">反馈用于后续批次；已有块是否重译，由后续规划判断。共享状态由主代理统一写入。</text>
<polyline points="720,1225 720,1260" fill="none" stroke="#81958A" stroke-width="3"/>
<polygon points="720.0,1260.0 714.0,1248.5 726.0,1248.5" fill="#81958A"/>
<text x="60" y="1301.0" font-size="25" font-weight="700" fill="#81958A">04</text>
<text x="113" y="1301.6" font-size="28" font-weight="700" fill="#20372F">校验与交付</text>
<text x="580" y="1299.5" font-size="21" font-weight="400" fill="#627269">先检查文件与结构，再合并和重建排版</text>
<rect x="60" y="1330" width="625" height="141" rx="15" fill="#EEF3FA" stroke="#416B9C" stroke-width="2"/>
<text x="82" y="1373.9" font-size="26" font-weight="700" fill="#416B9C">脚本校验</text>
<text x="82" y="1413.4" font-size="22" font-weight="400" fill="#20372F">缺块 / 空白 / 源文变化 / 图片引用异常</text>
<text x="82" y="1446.4" font-size="22" font-weight="400" fill="#20372F">不能证明没有漏译、误译或风格偏差</text>
<rect x="755" y="1330" width="625" height="141" rx="15" fill="#EEF3FA" stroke="#416B9C" stroke-width="2"/>
<text x="777" y="1373.9" font-size="26" font-weight="700" fill="#416B9C">合并 → Pandoc / Calibre</text>
<text x="777" y="1413.4" font-size="22" font-weight="400" fill="#20372F">Markdown → 带目录 HTML → DOCX / EPUB / PDF</text>
<text x="777" y="1446.4" font-size="22" font-weight="400" fill="#20372F">输出重新排版，不保证原书版式复刻</text>
<polyline points="685,1400 747,1400" fill="none" stroke="#81958A" stroke-width="3"/>
<polygon points="747.0,1400.0 735.5,1406.0 735.5,1394.0" fill="#81958A"/>
<rect x="60" y="1507" width="1320" height="110" rx="15" fill="#FFFFFF" stroke="#87988C" stroke-width="2" stroke-dasharray="9 9"/>
<text x="82" y="1546.0" font-size="25" font-weight="700" fill="#20372F">对我们的衔接 · 下游建议，尚未实现</text>
<text x="82" y="1589.0" font-size="25" font-weight="400" fill="#20372F">001 外刊来源 → 本项目翻译处理架构 → 双语对齐 → 精读、笔记与复习</text>
<text x="60" y="1672.5" font-size="21" font-weight="400" fill="#627269">研究边界：只做源码架构梳理，未运行整本书翻译，未测评质量 / 速度 / 成本；本项目无 Web 部署。</text>

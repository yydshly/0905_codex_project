<text x="60" y="509.0" font-size="25" font-weight="700" fill="#81958A">02</text>
<text x="113" y="509.6" font-size="28" font-weight="700" fill="#20372F">规划与并行翻译</text>
<text x="580" y="507.5" font-size="21" font-weight="400" fill="#627269">每块独立上下文；默认每批 8 个，依环境调整</text>
<rect x="60" y="540" width="1320" height="130" rx="15" fill="#EAF4EE" stroke="#287150" stroke-width="2"/>
<text x="82" y="583.9" font-size="26" font-weight="700" fill="#287150">主 AI 代理 + run_state.py：决定哪些块需要处理</text>
<text x="82" y="623.4" font-size="22" font-weight="400" fill="#20372F">读取 Skill 与现有状态 → 建立 / 读取术语表 → 安排翻译、补记状态或跳过</text>
<polyline points="720,670 720,709" fill="none" stroke="#81958A" stroke-width="3"/>
<polygon points="720.0,709.0 714.0,697.5 726.0,697.5" fill="#81958A"/>
<text x="170" y="737.1" font-size="24" font-weight="400" fill="#627269">每块输入：正文 + 相关 / 高频术语 + 前后各约 300 字符只读片段</text>
<rect x="60" y="766" width="420" height="144" rx="15" fill="#EAF4EE" stroke="#287150" stroke-width="2"/>
<text x="82" y="809.0" font-size="25" font-weight="700" fill="#287150">子代理 A · chunk0001</text>
<text x="82" y="849.4" font-size="22" font-weight="400" fill="#20372F">AI 翻译当前块，保留内容结构</text>
<text x="82" y="882.4" font-size="22" font-weight="400" fill="#20372F">写译文 + 独立 meta 观察文件</text>
<polyline points="270,910 270,944" fill="none" stroke="#81958A" stroke-width="3"/>
<polygon points="270.0,944.0 264.0,932.5 276.0,932.5" fill="#81958A"/>

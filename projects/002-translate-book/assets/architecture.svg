<text x="532" y="849.4" font-size="22" font-weight="400" fill="#20372F">AI 翻译当前块，保留内容结构</text>
<text x="532" y="882.4" font-size="22" font-weight="400" fill="#20372F">写译文 + 独立 meta 观察文件</text>
<polyline points="720,910 720,944" fill="none" stroke="#81958A" stroke-width="3"/>
<polygon points="720.0,944.0 714.0,932.5 726.0,932.5" fill="#81958A"/>
<rect x="960" y="766" width="420" height="144" rx="15" fill="#EAF4EE" stroke="#287150" stroke-width="2"/>
<text x="982" y="809.0" font-size="25" font-weight="700" fill="#287150">子代理 … · chunkNNNN</text>
<text x="982" y="849.4" font-size="22" font-weight="400" fill="#20372F">AI 翻译当前块，保留内容结构</text>
<text x="982" y="882.4" font-size="22" font-weight="400" fill="#20372F">写译文 + 独立 meta 观察文件</text>
<polyline points="1170,910 1170,944" fill="none" stroke="#81958A" stroke-width="3"/>
<polygon points="1170.0,944.0 1164.0,932.5 1176.0,932.5" fill="#81958A"/>
<text x="60" y="986.0" font-size="25" font-weight="700" fill="#81958A">03</text>
<text x="113" y="986.6" font-size="28" font-weight="700" fill="#20372F">反馈与状态记录</text>
<text x="580" y="984.5" font-size="21" font-weight="400" fill="#627269">先记录本批次状态，再合并观察与更新术语</text>
<rect x="60" y="1015" width="420" height="150" rx="15" fill="#EAF4EE" stroke="#287150" stroke-width="2"/>
<text x="82" y="1058.9" font-size="26" font-weight="700" fill="#287150">术语观察与冲突</text>
<text x="82" y="1098.4" font-size="22" font-weight="400" fill="#20372F">新实体 / 别名 / 证据</text>
<text x="82" y="1131.4" font-size="22" font-weight="400" fill="#20372F">主代理判断，脚本合并</text>
<rect x="510" y="1015" width="420" height="150" rx="15" fill="#FFF3DF" stroke="#956222" stroke-width="2"/>
<text x="532" y="1058.9" font-size="26" font-weight="700" fill="#956222">glossary.json</text>
<text x="532" y="1098.4" font-size="22" font-weight="400" fill="#20372F">规范译名、别名与术语约定</text>
<text x="532" y="1131.4" font-size="22" font-weight="400" fill="#20372F">主代理统一写入共享词表</text>
<rect x="960" y="1015" width="420" height="150" rx="15" fill="#FFF3DF" stroke="#956222" stroke-width="2"/>
<text x="982" y="1058.9" font-size="26" font-weight="700" fill="#956222">run_state.json</text>
<text x="982" y="1098.4" font-size="22" font-weight="400" fill="#20372F">源文 / 译文 / 所用术语哈希</text>
<text x="982" y="1131.4" font-size="22" font-weight="400" fill="#20372F">续跑与后续局部重译的依据</text>
<polyline points="480,1080 503,1080" fill="none" stroke="#956222" stroke-width="3"/>
<polygon points="503.0,1080.0 491.5,1086.0 491.5,1074.0" fill="#956222"/>

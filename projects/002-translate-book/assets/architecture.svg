<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1710" viewBox="0 0 1440 1710" role="img" aria-labelledby="title desc">
<title id="title">translate-book：长内容并行翻译架构</title>
<desc id="desc">从文档转换分块到 AI 并行翻译，术语反馈和状态记录支撑后续批次与重译，校验后合并导出。下游阅读学习为建议，未实现。</desc>
<rect width="1440" height="1710" fill="#F7F8F5"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="60" y="81.0" font-size="42" font-weight="700" fill="#20372F">一本书，如何交给多个 AI 协作翻译</text>
<text x="60" y="126.2" font-size="23" font-weight="400" fill="#627269">translate-book  /  架构研究  /  2026-09-05  /  commit 5d07e733</text>
<rect x="60" y="153" width="20" height="20" rx="15" fill="#EEF3FA" stroke="#416B9C" stroke-width="2"/>
<text x="93" y="169.4" font-size="22" font-weight="400" fill="#416B9C">脚本与转换工具</text>
